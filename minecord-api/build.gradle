// Declare dependencies
dependencies {
    api include(fabricApi.module("fabric-api-base", project.fabric_version))
    api include(fabricApi.module("fabric-lifecycle-events-v1", project.fabric_version))
    api include("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude module: 'fabric-api'
        exclude module: 'modmenu'
    }
    api include("eu.pb4:placeholder-api:${project.placeholder_api_version}")
    implementation "maven.modrinth:fabrictailor:${project.fabric_tailor_version}"
    implementation shade("com.vdurmont:emoji-java:${project.emoji_java_version}")
    implementation shade("net.dv8tion:JDA:${project.jda_version}") {
        exclude module: 'opus-java' // exclude audio
    }
}

// Configure the fat-jar of shaded dependencies
shadowJar {
    // Relocate problematic dependencies
    relocate 'kotlin', "${project.group}.shadow.kotlin"
}
